<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تیموس | نمونه تعاملی</title>
<style>
:root{--ink:#202124;--muted:#70757d;--line:#e7e4df;--paper:#fff;--bg:#f5f4f1;--orange:#c65b2e;--soft:#fff0e8;--green:#18794e;--amber:#986313;--blue:#315f91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.8 Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--orange);color:white}button.secondary{background:#f0efed;color:#333;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1160px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#ffb184;display:grid;place-items:center;font-weight:bold;font-size:20px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}.connection{font-size:12px;border:1px solid var(--line);background:white;border-radius:30px;padding:5px 10px}.layout{display:grid;grid-template-columns:210px 1fr;gap:15px}.nav,.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:15px}.nav{padding:10px;height:max-content;position:sticky;top:12px}.nav button{width:100%;text-align:right;background:transparent;color:#343434;margin:2px 0}.nav button.active{background:var(--soft);color:#8e3d1b;font-weight:bold}.nav .hint{color:var(--muted);font-size:11px;padding:10px}.main{min-width:0}.panel{padding:18px;min-height:600px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h2{margin:0;font-size:20px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{background:#faf9f7;border:1px solid var(--line);padding:14px;border-radius:12px}.metric b{display:block;font-size:25px;line-height:1.4}.metric span{font-size:12px;color:var(--muted)}.card{padding:13px;margin:9px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;padding:3px 9px;border-radius:30px;background:#f0efed;white-space:nowrap}.tag.warn{background:#fff1d6;color:#81570c}.tag.ok{background:#e7f5ed;color:var(--green)}.tag.info{background:#eaf1fa;color:var(--blue)}.tag.orange{background:var(--soft);color:#94451f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}label{font-size:12px;color:#555}input,select,textarea{width:100%;border:1px solid #d9d6d1;border-radius:9px;padding:9px;background:white;color:#222}textarea{min-height:70px;resize:vertical}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:#f1f0ee;color:#333}.tabs button.selected{background:var(--ink);color:white}.doc{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;cursor:pointer}.doc.selected{border-color:var(--orange);background:#fffaf7}.notice{padding:11px;border-radius:10px;background:#fff8e9;color:#76520e;font-size:12px;margin:10px 0}.success{background:#eaf6ef;color:#17633f}.bar{height:1px;background:var(--line);margin:15px 0}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}.table th{color:var(--muted);font-weight:normal}.hidden{display:none}.toast{position:fixed;bottom:18px;left:18px;background:#222;color:white;padding:10px 15px;border-radius:10px;display:none;z-index:5}.footer{margin-top:14px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:760px){.app{padding:10px}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto}.nav .hint{display:none}.panel{padding:13px;min-height:560px}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.connection{max-width:130px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark">ت</div><div><h1>تیموس</h1><small>مدیریت عملیات دفتر ترجمه</small></div></div><div class="connection" id="net">● آنلاین · داده آزمایشی</div></header>
<div class="layout"><nav class="nav" id="nav">
<button class="active" data-page="today">◷ امروز</button><button data-page="requests">＋ درخواست‌ها</button><button data-page="cases">▤ پرونده‌ها</button><button data-page="handoff">⇄ ارجاع و بازبینی</button><button data-page="finance">◈ مالی</button><button data-page="delivery">✓ تحویل</button><button data-page="alerts">⚑ هشدارها</button><div class="hint">نسخه آزمایشی · بدون اتصال به سرویس‌های بیرونی</div></nav>
<main class="main"><section class="panel" id="view"></section></main></div>
<div class="footer">TeamOS Interactive Prototype 0.1 · اطلاعات و مبالغ این نمونه ساختگی‌اند.</div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let page='today',requestSaved=false,caseActive=false,selectedDoc=0,draft='ارجاع نشده',payment='در انتظار تأیید',delivered=[false,false,false],offline=false,items=[];
const docs=[
 {name:'ریزنمرات',service:'ترجمه رسمی',status:'منتظر تأییدیه تحصیلی',tag:'warn',next:'پیگیری تأییدیه تحصیلی',owner:'منشی',due:'شروع زمان ترجمه پس از دریافت تأییدیه'},
 {name:'شناسنامه',service:'ترجمه رسمی + مهر مترجم',status:'آماده بازبینی مالک',tag:'info',next:'بازبینی پیش‌نویس نسخه ۲',owner:'مالک',due:'امروز'},
 {name:'گواهی اشتغال',service:'ترجمه غیررسمی روی سربرگ دفتر',status:'در حال تهیه پیش‌نویس',tag:'',next:'دریافت پیش‌نویس',owner:'مترجمیار الف',due:'فردا'}
];
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function head(title,sub=''){return '<div class="head"><div><h2>'+title+'</h2><div class="muted small">'+sub+'</div></div></div>'}
function render(){let v=$('#view');if(page==='today')v.innerHTML=head('امروز چه کاری باید جلو برود؟','داشبورد منشی · کارهای اولویت‌دار')+
'<div class="grid"><div class="metric"><b>۳</b><span>درخواست جدید</span></div><div class="metric"><b>۲</b><span>منتظر مشتری</span></div><div class="metric"><b>۴</b><span>ارجاع در جریان</span></div><div class="metric"><b>۱</b><span>در معرض تأخیر</span></div></div>'+
'<h3>اقدام‌های بعدی</h3>'+[
['پرونده 021 · ریزنمرات','پیگیری تأییدیه تحصیلی','منشی','امروز','warn'],
['پرونده 018 · شناسنامه','بررسی پیش‌نویس نسخه ۲','مالک','امروز','info'],
['پرونده 016 · وکالت‌نامه','ثبت در سامانه رسمی','منشی','امروز','ok'],
['درخواست نرگس الف','پیگیری تأیید قیمت','منشی','فردا','']
].map(x=>'<div class="card"><div class="row"><b>'+x[0]+'</b><span class="tag '+x[4]+'">'+x[3]+'</span></div><div class="small">'+x[1]+' · مسئول: '+x[2]+'</div></div>').join('')+
'<div class="actions"><button onclick="go(\'requests\')">＋ ثبت درخواست جدید</button><button class="secondary" onclick="go(\'cases\')">مشاهده پرونده نمونه</button></div>';
if(page==='requests')v.innerHTML=head('ثبت درخواست جدید','اطلاعات اولیه؛ پرونده فقط پس از تأیید مشتری فعال می‌شود')+
'<div class="formgrid"><div class="field"><label>نام مشتری *</label><input id="cname" placeholder="نام و نام خانوادگی"></div><div class="field"><label>شماره تماس یا شناسه گفتگو *</label><input id="phone" placeholder="شماره یا شناسه"></div><div class="field"><label>کانال ورودی</label><select id="channel"><option>واتساپ</option><option>بله</option><option>تماس</option><option>مراجعه حضوری</option><option>معرفی</option></select></div><div class="field"><label>نوع خدمت</label><select id="service"><option>ترجمه رسمی</option><option>مهر مترجم</option><option>ترجمه غیررسمی</option><option>ترجمه رسمی + تأییدات</option></select></div><div class="field full"><label>توضیح کوتاه (اختیاری)</label><textarea id="note" placeholder="مدارک، زبان مقصد یا نکته مهم"></textarea></div></div>'+
'<div class="actions"><button onclick="saveRequest()">ذخیره درخواست</button></div><div id="requestResult"></div>';
if(page==='cases')v.innerHTML=head('پرونده TM-1405-021','مشتری آزمایشی · مسئول هماهنگی: منشی · وضعیت کلی: در جریان')+
'<div class="notice">پیش‌نیاز آموزشی ریزنمرات هنوز دریافت نشده؛ زمان ترجمه از زمان دریافت تأییدیه آغاز می‌شود.</div>'+
'<div class="tabs">'+docs.map((d,i)=>'<button class="'+(selectedDoc===i?'selected':'')+'" onclick="selectDoc('+i+')">'+d.name+'</button>').join('')+'</div>'+
'<div class="card"><div class="row"><b>'+docs[selectedDoc].name+'</b><span class="tag '+docs[selectedDoc].tag+'">'+docs[selectedDoc].status+'</span></div><div class="bar"></div><div class="small">نوع خدمت: '+docs[selectedDoc].service+'</div><div class="small">اقدام بعدی: '+docs[selectedDoc].next+'</div><div class="small">مسئول: '+docs[selectedDoc].owner+'</div><div class="small">موعد: '+docs[selectedDoc].due+'</div></div>'+
'<h3>اسناد مستقل پرونده</h3><div class="small muted">تحویل یا تکمیل یک سند، وضعیت سند دیگر را تغییر نمی‌دهد.</div><div class="actions"><button class="secondary" onclick="go(\'handoff\')">ارجاع و بازبینی</button><button class="secondary" onclick="go(\'delivery\')">ثبت تحویل</button></div>';
if(page==='handoff')v.innerHTML=head('ارجاع و بازبینی','منشی ارجاع می‌دهد؛ مالک تأیید نهایی می‌کند.')+
'<div class="card"><b>ارجاع کار به مترجمیار</b><div class="formgrid" style="margin-top:10px"><div class="field"><label>سند</label><select id="assignDoc">'+docs.map((d,i)=>'<option value="'+i+'">'+d.name+'</option>').join('')+'</select></div><div class="field"><label>مترجمیار</label><select><option>مترجمیار الف</option><option>مترجمیار ب</option></select></div><div class="field"><label>موعد تحویل پیش‌نویس</label><input placeholder="مثلاً فردا ساعت ۱۲"></div><div class="field"><label>دستور کار</label><input placeholder="نکات خاص"></div></div><div class="actions"><button onclick="draft=\'ارجاع‌شده به مترجمیار\';toast(\'ارجاع ثبت شد\');render()">ثبت ارجاع</button></div></div>'+
'<div class="card"><div class="row"><b>صف بازبینی مالک</b><span class="tag '+(draft==='تأیید نهایی شد'?'ok':'info')+'">'+draft+'</span></div><div class="small muted">نسخه‌های قبلی در تاریخچه حفظ می‌شوند.</div><div class="actions"><button class="secondary" onclick="draft=\'آماده بازبینی مالک\';render()">شبیه‌سازی دریافت پیش‌نویس</button><button onclick="if(draft===\'آماده بازبینی مالک\'){draft=\'تأیید نهایی شد\';render()}else toast(\'ابتدا پیش‌نویس دریافت شود\')">تأیید نهایی</button><button class="secondary" onclick="draft=\'نیازمند اصلاح\';render()">درخواست اصلاح</button></div>'+(draft==='تأیید نهایی شد'?'<div class="notice success">آماده ثبت رسمی توسط منشی؛ چاپ، مهر و امضا با مالک است.</div>':'')+'</div>';
if(page==='finance')v.innerHTML=head('مالی عملیاتی پرونده','وصول واقعی از رسید ارسالی تفکیک می‌شود.')+
'<div class="card"><table class="table"><tr><th>عنوان</th><th>مبلغ</th><th>وضعیت</th></tr><tr><td>مبلغ توافق‌شده</td><td>۱۲,۰۰۰,۰۰۰</td><td>ثبت‌شده</td></tr><tr><td>رسید ارسالی</td><td>۱۲,۰۰۰,۰۰۰</td><td>نیازمند تأیید</td></tr><tr><td>وجه وصول‌شده</td><td>'+(payment==='تأیید شد'?'۱۲,۰۰۰,۰۰۰':'۰')+'</td><td>'+payment+'</td></tr><tr><td>هزینه مستقیم مترجمیار</td><td>۲,۰۰۰,۰۰۰</td><td>ثبت‌شده</td></tr></table><div class="actions"><button onclick="payment=\'تأیید شد\';render()" '+(payment==='تأیید شد'?'disabled':'')+'>تأیید دریافت وجه</button></div></div>'+
'<div class="notice">گزارش مطالبات، جریان نقدی و عملکرد خدمات باید جدا بمانند. مبنای «سود قطعی» هنوز تصمیم‌گیری نشده است.</div>';
if(page==='delivery')v.innerHTML=head('تحویل جزئی','ثبت تحویل برای هر سند به‌صورت مستقل')+
docs.map((d,i)=>'<div class="card"><div class="row"><b>'+d.name+'</b><span class="tag '+(delivered[i]?'ok':'')+'">'+(delivered[i]?'تحویل‌شده':'تحویل نشده')+'</span></div>'+(delivered[i]?'': '<button class="secondary" onclick="delivered['+i+']=true;render()">ثبت تحویل این سند</button>')+'</div>').join('')+
'<div class="notice">پرونده فقط زمانی بسته می‌شود که همه اسناد تعیین تکلیف شده و وضعیت مالی روشن باشد.</div>';
if(page==='alerts')v.innerHTML=head('هشدارها و موانع','سه سطح برای جلوگیری از هشدارهای تکراری و بی‌اثر')+
'<div class="card"><span class="tag warn">مسدودکننده ادامه کار</span><h3>تأییدیه تحصیلی ریزنمرات</h3><div class="small">مسئول رفع: منشی · اقدام بعدی: پیگیری مرجع صادرکننده</div><button class="secondary" onclick="toast(\'مانع به‌عنوان در حال پیگیری ثبت شد\')">شروع پیگیری</button></div>'+
'<div class="card"><span class="tag orange">تهدیدکننده موعد</span><h3>پیش‌نویس شناسنامه</h3><div class="small">مسئول: مالک · اقدام بعدی: بازبینی امروز</div></div>'+
'<div class="card"><span class="tag info">قابل پیگیری</span><h3>تکمیل اطلاعات تماس مشتری</h3><div class="small">مسئول: منشی · موعد: در اولین تماس بعدی</div></div>'+
'<div class="actions"><button class="secondary" onclick="offline=!offline;$(\'#net\').textContent=offline?\'● آفلاین · تغییرات فقط روی این دستگاه\':\'● آنلاین · داده آزمایشی\';toast(offline?\'حالت آفلاین فعال شد\':\'اتصال شبیه‌سازی شد\')">تغییر وضعیت آنلاین / آفلاین</button></div>'+
'<div class="notice">حالت آفلاین فقط نمایشی است؛ ذخیره‌سازی محلی، صف همگام‌سازی و تعارض واقعی هنوز پیاده‌سازی نشده‌اند.</div>';
}
function saveRequest(){let n=$('#cname').value.trim(),p=$('#phone').value.trim();if(!n||!p){toast('نام و راه تماس را وارد کنید');return}requestSaved=true;$('#requestResult').innerHTML='<div class="notice success">درخواست ذخیره شد؛ هنوز پرونده فعال نیست.<div class="actions"><button onclick="caseActive=true;toast(\'پرونده آزمایشی فعال شد\');go(\'cases\')">تبدیل به پرونده فعال</button></div></div>';toast('درخواست آزمایشی ذخیره شد')}
function selectDoc(i){selectedDoc=i;render()}
render();
</script></body></html>
